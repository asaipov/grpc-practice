version: '3'

vars:
  PROTO_DIR: proto
  GEN_DIR: gen/go
  PROTO_FILE: proto/sso/sso.proto

tasks:
  default:
    desc: "Список задач"
    cmds:
      - task --list

  generate:
    desc: "Генерация Go-кода из proto-файлов"
    dir: protos   # 👈 все команды выполняются внутри папки protos
    cmds:
      - protoc
        -I {{.PROTO_DIR}}
        {{.PROTO_FILE}}
        --go_out=./{{.GEN_DIR}}
        --go_opt=paths=source_relative
        --go-grpc_out=./{{.GEN_DIR}}
        --go-grpc_opt=paths=source_relative
    sources:
      - "protos/{{.PROTO_DIR}}/**/*.proto"
    generates:
      - "protos/{{.GEN_DIR}}/**/*.pb.go"

  clean:
    desc: "Удалить сгенерированные файлы"
    dir: protos
    cmds:
      - rm -rf {{.GEN_DIR}}

  install-plugins:
    desc: "Установить protoc-плагины для Go"
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest